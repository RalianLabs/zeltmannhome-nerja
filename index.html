 { q:'¿Cómo reservo?', a:'Directamente con nosotros por WhatsApp. Nos escribes con tus fechas, confirmamos disponibilidad y te enviamos todos los detalles. Sin plataformas de por medio.' },\n      { q:'¿Hay comisiones o cargos de servicio?', a:'No. Al reservar directamente te ahorras las comisiones de las plataformas: el precio que ves es el que pagas.' },\n      { q:'¿Se admiten mascotas?', a:'Lo sentimos, no se aceptan mascotas en ninguno de los dos apartamentos.' },\n      { q:'¿En qué idiomas atendéis?', a:'Hablamos español, inglés, alemán, francés e italiano. Escríbenos en el idioma que prefieras.' },\n      { q:'¿Cuál es el horario de entrada y salida?', a:'Entrada a partir de las 16:00 h y salida hasta las 11:00 h, con flexibilidad según disponibilidad. Te enviamos las instrucciones de acceso antes de tu llegada.' },\n      { q:'¿Están cerca de la playa?', a:'La Playa de la Torrecilla queda a unos 12 minutos a pie, y el Balcón de Europa y la Playa Burriana algo más allá. Es una zona residencial tranquila, muy cómoda para ir y volver caminando.' },\n      { q:'¿Cómo llego desde el aeropuerto de Málaga?', a:'Nerja está a unos 60 km (aprox. 1 hora en coche). También hay autobuses directos de ALSA desde la estación de Málaga hasta Nerja. Con gusto te orientamos al reservar.' }\n    ];\n    const pois = [\n      { name:'Playa de la Torrecilla', detail:'La playa más cercana', time:'12 min a pie' },\n      { name:'Balcón de Europa', detail:'Mirador y centro de Nerja', time:'15 min a pie' },\n      { name:'Playa Burriana', detail:'La playa más animada', time:'18 min a pie' },\n      { name:'Supermercados y cafeterías', detail:'En la propia zona', time:'2 min a pie' },\n      { name:'Cuevas de Nerja', detail:'A las afueras', time:'8 min en coche' }\n    ];\n    const guideCards = [\n      { tag:'Bienvenida', title:'Nerja, la perla de la Costa del Sol', mins:3,\n        summary:'Un pueblo con encanto entre el mar y la montaña, con un microclima privilegiado y luz todo el año.',\n        body:[\n          'Nerja se asienta donde la sierra de Almijara baja hasta el Mediterráneo, y ese abrazo entre montaña y mar le regala un microclima suave: temperaturas agradables casi todo el año y muchísimos días de sol.',\n          'Su balcón sobre el mar, el famoso Balcón de Europa, es el corazón del pueblo: un paseo de palmeras asomado a un acantilado con vistas de postal, ideal al atardecer.',\n          'A las afueras están las Cuevas de Nerja, uno de los grandes tesoros naturales de Andalucía, con enormes salas de estalactitas y conciertos en su interior. Y para los nostálgicos, este es el pueblo donde se rodó la mítica serie \"Verano Azul\".'\n        ] },\n      { tag:'Playas', title:'Las mejores playas y calas', mins:4,\n        summary:'Desde las playas urbanas del pueblo hasta las calas vírgenes de Maro. Dónde ir y dónde aparcar.',\n        body:[\n          'En el propio pueblo: la Playa de la Torrecilla (la más cercana a casa, unos 12 min a pie), el Playazo (larga y tranquila, con espacio de sobra) y Burriana, la más animada, con chiringuitos donde comer los espetos y el pescaíto junto al agua.',\n          'Rincones con encanto: la pequeña cala de Calahonda bajo el Balcón, y la playa del Chucho o Carabeo, algo más escondidas y con menos gente.',\n          'Calas vírgenes: el paraje natural de Maro-Cerro Gordo, a pocos minutos en coche, esconde algunas de las calas más bonitas del sur —Maro, Cañuelo, Las Alberquillas— de aguas cristalinas, perfectas para snorkel y kayak.',\n          'Aparcamiento: en verano conviene llegar temprano. En Burriana y Maro hay parkings de pago cerca del acceso; entre semana y a primera hora es mucho más fácil encontrar sitio.'\n        ] },\n      { tag:'Dónde comer', title:'Comer y cenar bien', mins:4,\n        summary:'Marisco y pescaíto, carnes, tapas, paellas junto al mar, italianos y sitios con vistas.',\n        body:[\n          'Pescado y marisco: los chiringuitos de Burriana son la apuesta segura para espetos de sardinas, fritura malagueña y arroces frente al mar.',\n          'Carnes y tapas: en las calles del centro encontrarás buenas brasas y la clásica ruta de tapas andaluza, con bares donde la caña acompaña siempre a algo rico.',\n          'Paellas y arroces: varios restaurantes junto a la playa los bordan, sobre todo al mediodía; merece la pena reservar en temporada alta.',\n          'Otras cocinas: Nerja tiene una comunidad internacional muy viva, así que no faltan buenos italianos, cocina de fusión y sitios con encanto y vistas al mar para una cena especial.'\n        ] },\n      { tag:'Desayunos', title:'Desayunos y cafés', mins:2,\n        summary:'Dónde empezar el día: tostadas con tomate, molletes, repostería y cafés con vistas.',\n        body:[\n          'Para el clásico andaluz —tostada con tomate y aceite o un mollete— hay cafeterías estupendas en el centro y cerca del Balcón de Europa.',\n          'Si te gusta desayunar con calma, busca las terrazas con vistas al mar: café, zumo recién hecho y el Mediterráneo de fondo. Un buen plan antes de bajar a la playa.'\n        ] },\n      { tag:'Escapadas', title:'Pueblos blancos y alrededores', mins:4,\n        summary:'Frigiliana, El Acebuchal, Torrox, Cómpeta, Comares… la Axarquía a un paso.',\n        body:[\n          'Frigiliana: a solo 10 minutos, uno de los pueblos más bonitos de España, un laberinto de callejuelas blancas, flores y rincones con vistas. Imprescindible.',\n          'El Acebuchal: el \"pueblo del fantasma\", una aldea recuperada entre montañas, perfecta para comer de campo un fin de semana.',\n          'Torrox, Cómpeta y Comares: pueblos blancos de la Axarquía rodeados de viñas y olivos, con miradores espectaculares y mucho vino moscatel. Ideales para una excursión de medio día en coche.'\n        ] },\n      { tag:'Práctico', title:'Llegada, parking y cómo moverse', mins:3,\n        summary:'Cómo llegar desde Málaga, dónde aparcar y moverte por Nerja durante tu estancia.',\n        body:[\n          'En coche: Nerja está a una hora de Málaga y su aeropuerto por la A-7. Nuestra calle, Joaquín Herrera, es una zona residencial tranquila donde suele ser fácil aparcar en la vía; también hay parkings públicos hacia el centro.',\n          'En autobús: ALSA conecta Málaga y el aeropuerto con la estación de Nerja de forma directa y frecuente.',\n          'Nerja se disfruta a pie: desde casa llegas caminando a la playa, al centro y al Balcón de Europa. Para las calas de Maro y los pueblos blancos, el coche es lo más cómodo.'\n        ] },\n      { tag:'Contacto', title:'Cualquier cosa, escríbenos', mins:1,\n        summary:'Estamos a un mensaje de distancia durante toda tu estancia.',\n        body:['Para lo que necesites —recomendaciones, una incidencia o ampliar tu estancia— escríbenos por WhatsApp al +34 609 549 664. Respondemos en español, inglés, alemán, francés e italiano.'] }\n    ];\n    return {\n      navStyle, navInk, navSub, navLinks,\n      menuOpen: this.state.menuOpen,\n      goHome:(e)=>{e.preventDefault();this.go('home');},\n      toggleMenu:()=>this.toggleMenu(),\n      waHomeLink: this.wa('Hola, me gustaría consultar disponibilidad en ZeltmannHome (Nerja).'),\n      heroSlides: this.heroSlides.map((s,i)=>({ ...s, op: i===this.state.heroSlide ? 1 : 0 })),\n      heroDots: this.heroSlides.map((s,i)=>({ active: i===this.state.heroSlide, bar: i===this.state.heroSlide ? '#0B2A44' : 'rgba(11,42,68,.28)', onClick:()=>{ this.setState({heroSlide:i}); this._startHero(); }, label:s.label })),\n      isHome: page==='home', isProperty: page==='property', isGuia: page==='guia',\n      heroImmersive, heroEditorial: !heroImmersive,\n      prop: active,\n      galleryItems: active.gallery.map((g,i)=>({ ...g, onClick:()=>this.openLb(active.gallery,i), big: i===0 })),\n      otherProp: this.state.activeSlug==='florence' ? props.isolde : props.florence,\n      goOther:(e)=>{e.preventDefault();this.go('property', this.state.activeSlug==='florence'?'isolde':'florence');},\n      propWaLink: this.wa('Hola, me gustaría consultar disponibilidad en '+active.name+' (Nerja).'),\n      goFlorence:(e)=>{e.preventDefault();this.go('property','florence');},\n      goIsolde:(e)=>{e.preventDefault();this.go('property','isolde');},\n      goGuia:(e)=>{e.preventDefault();this.go('guia');},\n      viewFlorence: props.florence, viewIsolde: props.isolde,\n      homeCards: [\n        { name:props.florence.name, door:props.florence.door, kicker:props.florence.kicker, tagline:props.florence.tagline, guests:props.florence.guests, beds: props.florence.bedrooms+' dormitorio', onClick:(e)=>{e.preventDefault();this.go('property','florence');} },\n        { name:props.isolde.name, door:props.isolde.door, kicker:props.isolde.kicker, tagline:props.isolde.tagline, guests:props.isolde.guests, beds: props.isolde.bedrooms+' dormitorios', onClick:(e)=>{e.preventDefault();this.go('property','isolde');} }\n      ],\n      seeCasas:(e)=>{e.preventDefault();this.scrollToId('casas');},\n      seeUbicacion:(e)=>{e.preventDefault();this.scrollToId('ubicacion');},\n      mapRef: this.mapRef,\n      reviews, review: this.state.review,\n      current: reviews[this.state.review],\n      prevReview:()=>this.setState(s=>({review:(s.review-1+reviews.length)%reviews.length})),\n      nextReview:()=>this.setState(s=>({review:(s.review+1)%reviews.length})),\n      stars: [0,1,2,3,4],\n      faq: faq.map((f,i)=>({ ...f, open: this.state.faqOpen===i, rot: this.state.faqOpen===i?'rotate(45deg)':'none', onClick:()=>this.setState(s=>({faqOpen: s.faqOpen===i?null:i})) })),\n      pois, guideCards,\n      guideTeaser: guideCards.slice(0,3).map(g=>({ title:g.title, mins:g.mins })),\n      guideItems: guideCards.map((g,i)=>({ ...g, num:String(i+1).padStart(2,'0'), open: this.state.guideOpen===i, label: this.state.guideOpen===i?'Cerrar':'Leer completo', rot: this.state.guideOpen===i?'rotate(45deg)':'none', onClick:()=>this.setState(s=>({guideOpen: s.guideOpen===i?null:i})) })),\n      waGuiaLink: this.wa('Hola, tengo una consulta sobre mi estancia en ZeltmannHome (Nerja).'),\n      guideOpen: this.state.guideOpen,\n      toggleGuide:(i)=>this.setState(s=>({guideOpen: s.guideOpen===i?null:i})),\n      lb: this.state.lb, lbImgs: this.state.lbImgs, lbIdx: this.state.lbIdx,\n      lbCurrent: this.state.lbImgs[this.state.lbIdx],\n      openLb:(imgs,i)=>this.openLb(imgs,i),\n      closeLb:()=>this.closeLb(),\n      lbPrev:()=>this.lbNext(-1), lbNext:()=>this.lbNext(1)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
